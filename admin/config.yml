backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  # 1. KOLEKSI PROFIL, APARAT & STATISTIK (File-based)
  - name: "pemerintahan"
    label: "Profil & Statistik Desa"
    delete: false
    editor:
      preview: false
    files:
      - name: "pemerintahan_data"
        label: "Update Informasi & Statistik"
        file: "data/pemerintahan.json"
        fields:
          - { label: "Judul Halaman", name: "title", widget: "hidden", default: "Data Pemerintahan" }
          
          # BAGIAN NAMA APARAT (DINAMIS - MENGGANTIKAN HARDCODE)
          - label: "Struktur Pemerintah Desa"
            name: "aparat"
            widget: "object"
            fields:
              - { label: "Nama Hukum Tua", name: "hukum_tua", widget: "string" }
              - { label: "Nama Sekdes", name: "sekdes", widget: "string" }
              - { label: "Nama Kasie Pemerintahan", name: "kasie_pem", widget: "string" }
              - { label: "Nama Kasie Kesra", name: "kasie_kesra", widget: "string" }
              - { label: "Nama Kasie Pelayanan", name: "kasie_pelayanan", widget: "string" }
              - { label: "Nama Kaur Umum", name: "kaur_umum", widget: "string" }
              - { label: "Nama Kaur Perencanaan", name: "kaur_rencana", widget: "string" }
              - { label: "Nama Kaur Keuangan", name: "kaur_keu", widget: "string" }
              - { label: "Nama Jaga 1", name: "jaga_1", widget: "string" }
              - { label: "Nama Jaga 2", name: "jaga_2", widget: "string" }
              - { label: "Nama Jaga 3", name: "jaga_3", widget: "string" }

          # BAGIAN JELAJAH DESA (PROFIL, VISI, MISI)
          - label: "Profil & Sejarah"
            name: "profil_section"
            widget: "object"
            fields:
              - { label: "Sejarah Desa", name: "sejarah", widget: "markdown" }
              - { label: "Visi Desa", name: "visi", widget: "string" }
              - { label: "Misi Desa", name: "misi", widget: "markdown" }
          
          # BAGIAN STATISTIK UTAMA
          - label: "Statistik Penduduk (Utama)"
            name: "stats_utama"
            widget: "object"
            fields:
              - { label: "Total Kepala Keluarga (KK)", name: "kk", widget: "string" }
              - { label: "Total Penduduk", name: "penduduk", widget: "string" }
              - { label: "Jumlah Laki-laki", name: "lk", widget: "string" }
              - { label: "Jumlah Perempuan", name: "pr", widget: "string" }

          # DATA LIST (STATISTIK DETAIL)
          - label: "Statistik: Pekerjaan"
            name: "pekerjaan"
            widget: "list"
            allow_add: true
            summary: "{{fields.nama}}: {{fields.jumlah}}"
            fields:
              - { label: "Jenis Pekerjaan", name: "nama", widget: "string" }
              - { label: "Jumlah", name: "jumlah", widget: "string" }

          - label: "Statistik: Agama"
            name: "agama"
            widget: "list"
            allow_add: true
            summary: "{{fields.nama}}: {{fields.jumlah}}"
            fields:
              - { label: "Agama", name: "nama", widget: "string" }
              - { label: "Jumlah", name: "jumlah", widget: "string" }

          - label: "Statistik: Pendidikan"
            name: "pendidikan"
            widget: "list"
            allow_add: true
            summary: "{{fields.nama}}: {{fields.jumlah}}"
            fields:
              - { label: "Tingkat Pendidikan", name: "nama", widget: "string" }
              - { label: "Jumlah", name: "jumlah", widget: "string" }

  # 2. KOLEKSI BERITA (Folder-based)
  - name: "berita"
    label: "Berita Desa"
    folder: "data/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Berita", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Kategori", name: "category", widget: "select", options: ["Kegiatan", "Pengumuman", "Pembangunan"] }
      - { label: "Foto Sampul", name: "image", widget: "image" }
      - { label: "Isi Berita", name: "body", widget: "markdown" }

  # 3. KOLEKSI POTENSI DESA (File-based - FIXED)
  - name: "potensi_list"
    label: "Potensi Desa"
    files:
      - name: "potensi_data"
        label: "Daftar Potensi Desa"
        file: "data/potensi.json"
        fields:
          - label: "Daftar Potensi"
            name: "potensi"
            widget: "list"
            fields:
              - { label: "Nama Potensi", name: "title", widget: "string" }
              - { label: "Kategori", name: "category", widget: "string" }
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Deskripsi", name: "description", widget: "text" }